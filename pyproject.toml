[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-studio-mcp-server"
version = "0.2.0"
description = "YouTube MCP server: upload videos (bulk, resumable), manage metadata, playlists, captions, comments, live streams, analytics and reports from Claude, ChatGPT, Cursor and other AI agents. YouTube Data API v3, Analytics API v2 and Reporting API v1."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abhishek Pandey" },
    { name = "AI Shopping Feeds" },
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "youtube",
    "youtube-mcp",
    "youtube-mcp-server",
    "youtube-api",
    "youtube-data-api",
    "youtube-analytics",
    "youtube-studio",
    "youtube-upload",
    "video-upload",
    "bulk-upload",
    "youtube-seo",
    "creator-tools",
    "claude",
    "chatgpt",
    "cursor",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.10",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/AI-Shopping-Feeds/youtube-studio-mcp"
Documentation = "https://github.com/AI-Shopping-Feeds/youtube-studio-mcp#readme"
Repository = "https://github.com/AI-Shopping-Feeds/youtube-studio-mcp"
Issues = "https://github.com/AI-Shopping-Feeds/youtube-studio-mcp/issues"
Changelog = "https://github.com/AI-Shopping-Feeds/youtube-studio-mcp/blob/main/CHANGELOG.md"
Upstream = "https://github.com/i1s-abhishek/youtube-studio-mcp"

[project.scripts]
youtube-studio-mcp = "youtube_studio_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_studio_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
